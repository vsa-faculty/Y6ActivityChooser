<script>

// Angular App
var app = angular.module('myApp', []);

app.controller('myCtrl', function($scope) {

  // ── State ──────────────────────────────────────────────────
  $scope.error        = {status: false, class: 'bg-danger', msg: 'Error'};
  $scope.dataFetching = false;
  $scope.data         = {};
  $scope.tripCounts   = [];
  $scope.activityList = [];
  $scope.maxSelections = 3;
  $scope.enableBuddyChoice = false;
  $scope.student      = null;   // single student record for current user
  $scope.activeActivityId = null;
  $scope.tokenSlotsData = [];
  function normalizeCanPostValue(value) {
    if (value === true || value === 1) return true;
    if (typeof value === 'string') {
      var normalized = value.trim().toLowerCase();
      return normalized === 'true' || normalized === '1';
    }
    return false;
  }

  function parseStudentDate(value) {
    if (!value) return null;
    if (value instanceof Date) {
      return isNaN(value.getTime()) ? null : value;
    }
    var parsed = new Date(value);
    return isNaN(parsed.getTime()) ? null : parsed;
  }

  function formatStudentDate(value) {
    var parsed = parseStudentDate(value);
    if (!parsed) return 'TBC';
    return parsed.toLocaleString('en-GB', {
      year: 'numeric',
      month: 'short',
      day: '2-digit',
      hour: '2-digit',
      minute: '2-digit',
      hour12: false
    });
  }

  $scope.isPostingWindowOpen = function() {
    var s = $scope.student;
    if (!s || !$scope.data.userType || !$scope.data.userType.isStudent) return false;
    var canPostValue = s.canPost;
    if (canPostValue === undefined || canPostValue === null) {
      canPostValue = s.canpost;
    }
    var canPostAllowed = normalizeCanPostValue(canPostValue);
    var startDate = parseStudentDate(s.postStartDate);
    var endDate = parseStudentDate(s.postEndDate);
    if (!canPostAllowed || !startDate || !endDate) return false;

    var now = new Date();
    return startDate < now && now < endDate;
  };

  $scope.getPostingWindowNotice = function() {
    var s = $scope.student;
    if (!s) return '';
    return 'Choices open: ' + formatStudentDate(s.postStartDate) + ' to ' + formatStudentDate(s.postEndDate) + '.';
  };

  $scope.canEditChoices = function() {
    return $scope.isPostingWindowOpen();
  };

  $scope.hasStudentRecord = function() {
    return !!$scope.student;
  };

  function hasUnsavedEditableChanges() {
    return !!($scope.canEditChoices && $scope.canEditChoices() && $scope.isSaved && !$scope.isSaved());
  }

  function handleBeforeUnload(event) {
    if (!hasUnsavedEditableChanges()) return;
    var warning = 'You have unsaved changes. Are you sure you want to leave this page?';
    event.preventDefault();
    event.returnValue = warning;
    return warning;
  }

  window.addEventListener('beforeunload', handleBeforeUnload);
  $scope.$on('$destroy', function() {
    window.removeEventListener('beforeunload', handleBeforeUnload);
  });

  // ── Boot ───────────────────────────────────────────────────
  function loadData() {
    $scope.dataFetching = true;
    google.script.run.withSuccessHandler(showData).withFailureHandler(function(e){
      $scope.dataFetching = false;
      $scope.error = {status: true, class: 'bg-danger', msg: 'Failed to load: ' + e.message};
      $scope.$digest();
    }).loadGInfo();
  }
  loadData();

  function showData(data) {
    $scope.data         = data;
    $scope.dataFetching = false;
    $scope.error        = data.error;
    try {
      $scope.tripCounts       = data.tripCounts;
        // Normalize Choices sheet column names to camelCase for the UI.
        // The sheet uses "ChoiceID" and "Choice Name"; we map to choiceID / displayName.
        $scope.activityList = (data.activityList || []).map(function(a) {
          var rawTheme = (a.theme || '').toString().trim().toLowerCase();
          var rawOrder = Number(a.order);
          return {
            choiceID:    a['ChoiceID']    || a.choiceID    || '',
            displayName: a['Choice Name'] || a.displayName || '',
            order:       Number.isFinite(rawOrder) ? rawOrder : 999,
            description: a.description || 'Activity details will be published soon.',
            staff:       a.staff || 'TBC',
            room:        a.room || 'TBC',
            emoji:       a.emoji || '🎯',
            theme:       rawTheme
          };
        });
      $scope.maxSelections    = data.maxSelections;
      $scope.enableBuddyChoice = !!data.enableBuddyChoice;
      $scope.buddyList        = data.buddyList;

      // Only student accounts get a writable/readable personal choice state in the UI.
      if (data.userType && data.userType.isStudent) {
        var allStudents = processStudentData(data.studentInfo, data.tripCounts, data.dataFields);
        $scope.student = allStudents.length > 0 ? allStudents[0] : null;
      } else {
        $scope.student = null;
      }

      // Default to first activity tab
      if ($scope.activityList.length > 0 && !$scope.activeActivityId) {
        var sorted = $scope.activityList.slice().sort(function(a,b){ return a.order - b.order; });
        $scope.activeActivityId = sorted[0].choiceID;
      }
      refreshTokenSlots();
    } catch(e) {
      $scope.error = {status: true, class: 'bg-danger', msg: e.toString()};
      console.error(e);
    }
    $scope.$digest();
  }

  // ── Student data processing ────────────────────────────────
  function processStudentData(students, tripCounts, dataFields) {
    students.forEach(function(s){ processStudent(s, tripCounts, dataFields); });
    return students;
  }

  function processStudent(student, tripCounts, dataFields) {
    student.currentChoice  = {};
    student.selected       = [];
    student.countSelected  = 0;

    tripCounts.forEach(function(trip) {
      var choiceID = trip.choiceID;
      if (student[choiceID] !== undefined) {
        if      (student[choiceID] === 1)  { student.currentChoice[choiceID] = true;  }
        else if (student[choiceID] === -1) { student.currentChoice[choiceID] = -1;    }
        else                               { student.currentChoice[choiceID] = false; }

        if (student[choiceID] === 1 || student[choiceID] === true) {
          student.selected.push(choiceID);
          student.countSelected++;
        }
      }
    });

    student.currentExtraData = {};
    for (var f = 0; f < dataFields.length; f++) {
      var dataId = dataFields[f];
      if (student[dataId] !== undefined) {
        student.currentExtraData[dataId] = student[dataId];
      }
    }
    student.lastSavedChoice    = JSON.parse(JSON.stringify(student.currentChoice));
    student.lastSavedExtraData = JSON.parse(JSON.stringify(student.currentExtraData));
  }

  // ── Token helpers ──────────────────────────────────────────
  function refreshTokenSlots() {
    var s = $scope.student;
    if (!s) {
      $scope.tokenSlotsData = [];
      return;
    }
    var slots = [];
    // Collect chosen activities with metadata
    var chosen = [];
    $scope.activityList.forEach(function(a) {
      if (s.currentChoice[a.choiceID] && s.currentChoice[a.choiceID] !== -1) {
        chosen.push(a);
      }
    });
    chosen.sort(function(a,b){ return a.order - b.order; });
    for (var i = 0; i < $scope.maxSelections; i++) {
      if (chosen[i]) {
        slots.push({filled: true, choiceID: chosen[i].choiceID, displayName: chosen[i].displayName, emoji: chosen[i].emoji});
      } else {
        slots.push({filled: false});
      }
    }
    $scope.tokenSlotsData = slots;
  }

  // ── Tab navigation ─────────────────────────────────────────
  $scope.setActiveActivity = function(choiceID) {
    $scope.activeActivityId = choiceID;
  };

  $scope.isKnownTheme = function(theme) {
    return theme === 'sculpture' || theme === 'robotics' || theme === 'rockets' || theme === 'mystery';
  };

  // ── Sign-up / Drop-out ─────────────────────────────────────
  $scope.signUp = function(activity) {
    var s = $scope.student;
    if (!s || s.currentChoice[activity.choiceID] === -1) return;
    if (s.countSelected >= $scope.maxSelections) return;
    s.currentChoice[activity.choiceID] = true;
    recount(s);
    refreshTokenSlots();
  };

  $scope.dropChoice = function(choiceID) {
    var s = $scope.student;
    if (!s || s.currentChoice[choiceID] === -1) return;
    s.currentChoice[choiceID] = false;
    recount(s);
    refreshTokenSlots();
  };

  function recount(student) {
    student.selected      = [];
    student.countSelected = 0;
    for (var key in student.currentChoice) {
      if (student.currentChoice[key] === true || student.currentChoice[key] === 1) {
        student.selected.push(key);
        student.countSelected++;
      }
    }
  }

  // ── Save state helper ──────────────────────────────────────
  $scope.isSaved = function() {
    var s = $scope.student;
    if (!s) return true;
    return angular.equals(s.currentChoice, s.lastSavedChoice) &&
           angular.equals(s.currentExtraData, s.lastSavedExtraData);
  };

  // ── Post choices ───────────────────────────────────────────
  $scope.studentPostChoices = function(rowindex, studentId, currentChoice, currentExtraData, sindex) {
    if (!$scope.data.userType || !$scope.data.userType.isStudent) {
      $scope.error = {status: true, class: 'bg-danger', msg: 'Only student accounts can save choices.'};
      return;
    }
    $scope.dataFetching = true;
    google.script.run
      .withSuccessHandler(saveSuccess)
      .withFailureHandler(function(e){
        $scope.dataFetching = false;
        $scope.error = {status: true, class: 'bg-danger', msg: 'Save failed: ' + e.message};
        $scope.$digest();
      })
      .studentPostData(rowindex, studentId, currentChoice, currentExtraData, sindex);
  };

  function saveSuccess(e) {
    $scope.dataFetching = false;
    $scope.error = e.error;
    if (e.hasOwnProperty('update')) {
      var update = e.update;
      var s = $scope.student;
      for (var key in update) { s[key] = update[key]; }
      processStudent(s, $scope.tripCounts, $scope.data.dataFields);
      refreshTokenSlots();
    } else {
      loadData();
    }
    $scope.$digest();
  }

});




//-----
// getExistingRow - returns the row that contains the data matching the criteria, or returns the next row in the spreadsheet.
//
//-----
function getExistingRow(myList,checkCol,checkCriteria){
  var myRow = 0;
  while (myRow < myList.length){
    if (myList[myRow][checkCol] == checkCriteria) {
      return myRow;
    }
    myRow++;
  } 
  return myRow;
}



//-----
//   getRowsMatching takes a data list and searches the sortIndex for all values that match valueToFind, returning the rows that match this value
//-----

function getRowsMatching(myDataList, sortIndex, valueToFind){
  
  var foundList = new Array();
  
  myDataList.sort(function(a, b){ //Sort the items by studentID
    var x = a[sortIndex];
    var y = b[sortIndex];
    return (x < y ? -1 : (x > y ? 1 : 0));});
  
  var cdr = 0;
  var found = false; 
  
  while ( cdr < myDataList.length){
    if (myDataList[cdr][sortIndex] == valueToFind) {
      found=true;
      foundList.push(myDataList[cdr])
    }
    else if (found){
      return foundList;
    }
    cdr++;
  }

  return foundList;
  
}

//Returns True if Value is found in col column of myArray 2D array
function findThisInArray(myArray, value, col){
  for( var i = 0; i < myArray.length; i++ ) {
      if(myArray[i][col] == value ) {
          return true;
          break;
      }
    
  }
  return false;
}
  </script>
